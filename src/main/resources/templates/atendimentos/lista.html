<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Horários de atendimento')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('atendimentos')}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Horários de atendimento</h2>
        <a th:href="@{/atendimentos/novo(profissionalId=${profissionalId}, pacienteId=${pacienteId})}" class="btn btn-primary">
            <i class="bi bi-calendar-plus"></i> Agendar</a>
    </div>

    <form th:action="@{/atendimentos}" method="get" class="card card-body mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label small">De</label>
                <input type="date" name="de" th:value="${de}" class="form-control">
            </div>
            <div class="col-md-2">
                <label class="form-label small">Até</label>
                <input type="date" name="ate" th:value="${ate}" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label small">Profissional</label>
                <select name="profissionalId" class="form-select">
                    <option value="">Todos</option>
                    <option th:each="p : ${profissionais}" th:value="${p.id}" th:text="${p.nome}"
                            th:selected="${p.id == profissionalId}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">Paciente</label>
                <select name="pacienteId" class="form-select">
                    <option value="">Todos</option>
                    <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}"
                            th:selected="${p.id == pacienteId}"></option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button class="btn btn-outline-primary"><i class="bi bi-funnel"></i> Filtrar</button>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Data</th><th>Horário</th><th>Paciente</th><th>Profissional</th><th>Atendimento</th><th>Sala</th><th>Situação</th><th></th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(atendimentos)}"><td colspan="8" class="text-muted text-center py-4">Nenhum atendimento no período.</td></tr>
                <tr th:each="a : ${atendimentos}">
                    <td class="text-nowrap">
                        <span th:text="${#temporals.format(a.data, 'dd/MM/yyyy')}"></span>
                        <div class="small text-muted" th:text="${#temporals.dayOfWeekName(a.data)}"></div>
                    </td>
                    <td class="hora" th:text="${#temporals.format(a.horaInicio, 'HH:mm')} + ' – ' + ${#temporals.format(a.horaFim, 'HH:mm')}"></td>
                    <td th:text="${a.paciente.nome}"></td>
                    <td><a th:href="@{/agenda(profissionalId=${a.profissional.id}, data=${a.data})}" th:text="${a.profissional.nome}"></a></td>
                    <td th:text="${a.tipo.descricao}"></td>
                    <td th:text="${a.sala}"></td>
                    <td><span class="badge" th:classappend="'text-bg-' + ${a.status.cor}" th:text="${a.status.descricao}"></span></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/atendimentos/{id}/editar(id=${a.id})}" class="btn btn-sm btn-outline-secondary" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/atendimentos/{id}/excluir(id=${a.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Excluir este atendimento?')">
                            <input type="hidden" name="voltar" th:value="${voltar}">
                            <button class="btn btn-sm btn-outline-danger" title="Excluir"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
