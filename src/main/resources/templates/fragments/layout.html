<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Sistema APAE'">Sistema APAE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="navbar(ativo)" class="navbar navbar-expand-lg navbar-dark bg-apae mb-4 d-print-none">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}"><i class="bi bi-heart-pulse"></i> Sistema APAE</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'agenda'} ? active"
                                        th:href="@{/agenda}"><i class="bi bi-calendar-day"></i> Agenda do dia</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'atendimentos'} ? active"
                                        th:href="@{/atendimentos}"><i class="bi bi-calendar-week"></i> Horários</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'pacientes'} ? active"
                                        th:href="@{/pacientes}"><i class="bi bi-people"></i> Pacientes</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${ativo == 'profissionais'} ? active"
                                        th:href="@{/profissionais}"><i class="bi bi-person-badge"></i> Profissionais</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="mensagens">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show d-print-none">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
