<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Acessos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="mb-0">Acessos ao sistema</h2>
        <a th:href="@{/usuarios/novo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Novo acesso da administração</a>
    </div>
    <p class="text-muted">Para dar acesso a um professor ou terapeuta, use <a th:href="@{/profissionais}">Profissionais</a> → “Criar acesso”.</p>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Usuário</th><th>Perfil</th><th>Profissional</th><th>Situação</th><th></th></tr></thead>
                <tbody>
                <tr th:each="u : ${usuarios}" th:classappend="${!u.ativo} ? 'tr-inativo'">
                    <td class="fw-semibold" th:text="${u.login}"></td>
                    <td th:text="${u.perfil.descricao}"></td>
                    <td th:text="${u.profissional?.nome}"></td>
                    <td>
                        <span th:if="${u.ativo}" class="badge text-bg-success">ativo</span>
                        <span th:unless="${u.ativo}" class="badge text-bg-secondary">bloqueado</span>
                        <span th:if="${u.trocarSenha}" class="badge text-bg-warning">aguardando troca de senha</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i> Editar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
