<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Pacientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('pacientes')}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Pacientes</h2>
        <a th:href="@{/pacientes/novo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Novo paciente</a>
    </div>

    <form th:action="@{/pacientes}" method="get" class="mb-3">
        <div class="input-group">
            <input type="search" name="busca" th:value="${busca}" class="form-control" placeholder="Buscar pelo nome...">
            <button class="btn btn-outline-secondary"><i class="bi bi-search"></i></button>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Nome</th><th>Idade</th><th>Diagnóstico / CID</th><th>Responsável</th><th>Telefone</th><th></th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(pacientes)}"><td colspan="6" class="text-muted text-center py-4">Nenhum paciente cadastrado.</td></tr>
                <tr th:each="p : ${pacientes}" th:classappend="${!p.ativo} ? 'tr-inativo'">
                    <td>
                        <span th:text="${p.nome}"></span>
                        <span th:unless="${p.ativo}" class="badge text-bg-secondary">inativo</span>
                    </td>
                    <td th:text="${p.idade != null} ? ${p.idade} + ' anos' : ''"></td>
                    <td th:text="${p.diagnostico}"></td>
                    <td th:text="${p.responsavel}"></td>
                    <td th:text="${p.telefone}"></td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/atendimentos(pacienteId=${p.id})}" class="btn btn-sm btn-outline-primary" title="Horários do paciente"><i class="bi bi-calendar-week"></i></a>
                        <a th:href="@{/atendimentos/novo(pacienteId=${p.id})}" class="btn btn-sm btn-outline-success" title="Agendar"><i class="bi bi-calendar-plus"></i></a>
                        <a th:href="@{/pacientes/{id}/editar(id=${p.id})}" class="btn btn-sm btn-outline-secondary" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/pacientes/{id}/excluir(id=${p.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Excluir este paciente? Se ele tiver atendimentos, será apenas inativado.')">
                            <button class="btn btn-sm btn-outline-danger" title="Excluir"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
