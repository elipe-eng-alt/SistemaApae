spring.application.name=sistema-apae
server.port=8080
server.servlet.session.tracking-modes=cookie

# Banco de dados H2 salvo em arquivo (pasta ./data). Os dados ficam guardados entre reinicios.
spring.datasource.url=jdbc:h2:file:./data/apae;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Console para consultar o banco: http://localhost:8080/h2-console (use a JDBC URL acima)
spring.h2.console.enabled=true
